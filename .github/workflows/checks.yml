name: Vigilo checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon/vigilo/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: addon/vigilo/server/go.mod
          cache-dependency-path: addon/vigilo/server/go.sum
      - name: Unit and integration tests
        run: go test ./... -count=1
      - name: Static analysis
        run: go vet ./...
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Save separately installable Vigilo 2 beta APK
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vigilo-2-foundations' }}
        uses: actions/upload-artifact@v4
        with:
          name: Vigilo2-Beta-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ha-smoke-package:
    name: Home Assistant isolated smoke package
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vigilo-2-foundations' }}
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated HA add-on archive
        run: |
          python3 scripts/package_ha_smoke.py --out dist/vigilo2-ha-smoke.tar.gz
          sha256sum dist/vigilo2-ha-smoke.tar.gz | tee dist/vigilo2-ha-smoke.sha256
          python3 - <<'PY'
          import tarfile
          with tarfile.open("dist/vigilo2-ha-smoke.tar.gz", "r:gz") as t:
              c = t.extractfile("vigilo2_smoke/config.yaml").read().decode()
              d = t.extractfile("vigilo2_smoke/Dockerfile").read().decode()
              assert "slug: vigilo2_smoke" in c
              assert "boot: manual_only" in c
              assert "ENV VIGILO_ISOLATED_PREVIEW=1" in d
              assert "slug: vigilo\\n" not in c
          PY
      - name: Upload isolated HA smoke archive (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Vigilo2-HA-Isolated-Smoke
          path: |
            dist/vigilo2-ha-smoke.tar.gz
            dist/vigilo2-ha-smoke.sha256
          if-no-files-found: error
          retention-days: 14

  ha-upgrade-candidate:
    name: Home Assistant in-place upgrade candidate (no deploy)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/vigilo-2-foundations' }}
    needs: [backend, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source-only Vigilo upgrade candidate
        run: |
          python3 scripts/package_ha_upgrade_candidate.py --out dist/vigilo2-ha-upgrade-candidate.tar.gz
          sha256sum dist/vigilo2-ha-upgrade-candidate.tar.gz > dist/vigilo2-ha-upgrade-candidate.sha256
          python3 - <<'PY'
          import tarfile
          with tarfile.open("dist/vigilo2-ha-upgrade-candidate.tar.gz", "r:gz") as t:
              c=t.extractfile("vigilo/config.yaml").read().decode()
              d=t.extractfile("vigilo/Dockerfile").read().decode()
              assert "slug: vigilo\\n" in c
              assert "version: \\"2.0.0-beta.1\\"" in c
              assert "VIGILO_ISOLATED_PREVIEW=1" not in d
              assert t.getmember("vigilo/server/v2_upgrade_safety_test.go")
          PY
      - name: Upload non-installing upgrade candidate
        uses: actions/upload-artifact@v4
        with:
          name: Vigilo2-HA-InPlace-Candidate
          path: |
            dist/vigilo2-ha-upgrade-candidate.tar.gz
            dist/vigilo2-ha-upgrade-candidate.sha256
          if-no-files-found: error
          retention-days: 14

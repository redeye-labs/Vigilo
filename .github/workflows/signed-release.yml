name: Vigilo APK firmato

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Pubblica anche su GitHub Releases (solo dopo i test)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets exist
        env:
          KEY_B64: ${{ secrets.VIGILO_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VIGILO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIGILO_KEY_ALIAS }}
        run: |
          for var in KEY_B64 KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing signing secret ${var}. Read docs/SIGNING_FROM_PHONE.md"
              exit 1
            fi
          done
      - name: Restore release keystore privately
        env:
          KEY_B64: ${{ secrets.VIGILO_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/vigilo-release.jks"
          test -s "$RUNNER_TEMP/vigilo-release.jks"
      - name: Validate signing key before Gradle
        env:
          VIGILO_KEYSTORE_PASSWORD: ${{ secrets.VIGILO_KEYSTORE_PASSWORD }}
          VIGILO_KEY_ALIAS: ${{ secrets.VIGILO_KEY_ALIAS }}
        run: |
          # Remove accidental CR/LF from values copied on mobile.
          PASS="${VIGILO_KEYSTORE_PASSWORD%        env:
          VIGILO_KEYSTORE_PATH: ${{ runner.temp }}/vigilo-release.jks
          VIGILO_KEY_ALIAS: ${{ secrets.VIGILO_KEY_ALIAS }}
          VIGILO_KEYSTORE_PASSWORD: ${{ secrets.VIGILO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Vigilo.apk
      - name: Save installable APK (private signing key is never uploaded)
        uses: actions/upload-artifact@v4
        with:
          name: Vigilo-Release-APK
          path: dist/Vigilo.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed GitHub Release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" || { echo "::error::versionName missing"; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionName/versionCode first."
            exit 1
          fi
          gh release create "$TAG" dist/Vigilo.apk --target "$GITHUB_SHA" --title "Vigilo $VERSION" --notes "APK Android firmato con la chiave Vigilo conservata nei GitHub Actions Secrets."
      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/vigilo-release.jks"

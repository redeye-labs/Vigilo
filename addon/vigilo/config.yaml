name: Vigilo
version: "2.0.0-beta.9"
slug: vigilo
description: Vigilo 2 beta sperimentale - moduli Tesla e sicurezza. Non installare sulla produzione senza backup e collaudo.
url: https://github.com/redeye-labs/Vigilo
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-car
panel_title: Vigilo
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
options:
  tailscale_hostname: vigilo
schema:
  tailscale_hostname: "match(^[a-z0-9-]{1,40}$)"
  tailscale_authkey: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ssl: bool?

name: Vigilo
version: "1.0.9"
slug: vigilo
description: Avvisi Sentinella in tempo reale, comandi e storico per la tua auto, con l'app Android Vigilo.
url: https://github.com/redeye-labs/Vigilo
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-car
panel_title: Vigilo
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
options:
  tailscale_hostname: vigilo
schema:
  tailscale_hostname: "match(^[a-z0-9-]{1,40}$)"
  tailscale_authkey: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ssl: bool?

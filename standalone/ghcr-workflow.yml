# DA ATTIVARE A MANO: copia questo file in .github/workflows/standalone-image.yml dal sito GitHub
# (Add file › Create new file). Non è già lì perché il push automatico non ha il permesso "workflow".
# Immagine Docker della versione standalone su GHCR (gratuito per repository pubblici).
# Parte SOLO a mano: Actions › "Standalone image (manual)" › Run workflow.
name: Standalone image (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag dell'immagine (preview = quella usata dagli installatori)"
        required: true
        default: "preview"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_VERSION=standalone-${{ inputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/vigilo-standalone:${{ inputs.tag }}
